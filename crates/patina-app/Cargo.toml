[package]
name = "patina-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Development-only offline accounts, forwarded to patina-core. Off by default
# so a release build never carries them; `cargo app` (see .cargo/config.toml)
# enables it.
dev-offline = ["patina-core/dev-offline"]
# Test doubles (`core_bridge::testing`) for this crate's integration tests.
# Never enabled by a release build.
test-support = []

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
futures = "0.3.34"
gpui-kit.workspace = true
patina-core = { version = "0.1.0", path = "../patina-core" }
# Only to build the test core's offline client; the same version and
# features as patina-core's, so nothing new is compiled.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
rust-i18n = "4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
toml = "1.1.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
# Same source and version as the normal dependency; adds headless windows.
gpui-kit = { workspace = true, features = ["test-support"] }
# This crate with its test doubles, for the integration tests in `tests/`.
patina-app = { path = ".", features = ["test-support"] }
# Launch entry points that skip prepare (fake games) and a stand-in launch
# account, for the launch tests only; release builds never get them.
patina-core = { version = "0.1.0", path = "../patina-core", features = ["test-support"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.154"
tempfile = "3.27.0"

[[bin]]
name = "patina"
path = "src/main.rs"
