[package]
name = "patina-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
dev-offline = []

[dependencies]
dirs = "7.0.0"
futures = "0.3.34"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
lzma-rust2 = { version = "0.23.0", default-features = false, features = ["std", "xz"] }
md-5 = "0.11.0"
quick-xml = "0.42.0"
regex = "1.13.1"
rustix = { version = "1.1", features = ["process"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
rust-i18n = "4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sysinfo = { version = "0.40.0", default-features = false, features = ["system"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
toml_edit = { version = "0.25.17", default-features = false, features = ["parse", "display"] }
tracing = "0.1"
uuid = { version = "1.29.0", features = ["v4"] }
zip = "9.1.3"

[dev-dependencies]
serde-saphyr = "2.0.0"
tempfile = "3.27.0"
tracing-subscriber = "0.3"
wiremock = "0.6.5"
