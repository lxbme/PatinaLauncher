[package]
name = "patina-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
dev-offline = []
# Exposes isolated fixtures for other crates' tests.
test-support = []

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
dirs = "7.0.0"
flate2 = "1.1"
futures = "0.3.34"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
lzma-rust2 = { version = "0.23.0", default-features = false, features = ["std", "xz"] }
md-5 = "0.11.0"
quick-xml = "0.42.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "form", "json"] }
rust-i18n = "4"
rustix = { version = "1.1", default-features = false, features = ["std", "process", "fs", "net"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sysinfo = { version = "0.40.0", default-features = false, features = ["system"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
toml_edit = { version = "0.25.17", default-features = false, features = ["parse", "display"] }
tracing = "0.1"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
zeroize = "1.9.1"
zip = "9.1.3"

[target.'cfg(target_os = "linux")'.dependencies]
# Match GPUI's oo7 runtime feature; only its runtime-neutral low-level API is used.
oo7 = { version = "=0.6.0", default-features = false, features = ["async-std", "native_crypto", "unstable"] }
# zbus selects Tokio inside the credential adapter's owned runtime.
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
# Isolated capacity regression for image -> png's pinned inflater.
fdeflate = "=0.3.7"
zbus = { version = "=5.19.0", default-features = false, features = ["tokio", "p2p"] }
tokio = { version = "1.54.1", features = ["test-util"] }
fastnbt = "2.6.3"
serde-saphyr = "2.0.0"
tempfile = "3.27.0"
tracing-subscriber = "0.3"
wiremock = "0.6.5"

[[test]]
name = "auth_contract"
required-features = ["test-support"]
