[package]
name = "patina-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
dev-offline = []

[dependencies]
dirs = "7.0.0"
futures = "0.3.34"
hex = "0.4.3"
md-5 = "0.11.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
uuid = { version = "1.29.0", features = ["v4"] }
zip = "9.1.3"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
