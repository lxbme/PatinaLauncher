errors:
  config:
    io: "Failed to read or write the config file: %{error}"
    parse: "Invalid config file format: %{error}"
    serialize: "Failed to serialize the config: %{error}"
  instance:
    io: "File operation failed: %{error}"
    parse: "Invalid instance config format: %{error}"
    serialize: "Failed to serialize the instance config: %{error}"
    not_found: "Instance not found: %{id}"
    invalid_id: "Invalid instance ID: %{id}"
    invalid_config: "Invalid instance config: %{reason}"
    config_reason:
      no_minecraft: "the first component must be minecraft"
      multiple_loaders: "at most one loader component is allowed"
      minecraft_profile: "the minecraft component must not have a profile"
      empty_version: "the Minecraft version must not be empty"
      duplicate_minecraft: "only one minecraft component is allowed"
      not_a_loader: "the component is not a mod loader"
  loader:
    no_versions: "No %{kind} versions are available for Minecraft %{mc}"
    version_not_found: "%{kind} version %{version} does not exist"
    parse: "Failed to parse the loader version data: %{error}"
    io: "File operation failed: %{error}"
    json: "Invalid loader version data: %{error}"
    unsafe_metadata: "The loader metadata contains an unsafe name: %{name}"
    installer_invalid: "The loader installer is invalid: %{reason}"
    processor_failed: "Loader installation step %{step} failed (exit code %{code})"
    processor_killed: "Loader installation step %{step} was stopped before it finished"
    processor_output_mismatch: "A file generated during loader installation is incorrect: %{path}"
    legacy_library_unavailable: "The legacy loader library %{name} could not be obtained from any download source"
    conflict: "This instance already has %{existing} %{version}; switching to another loader replaces it, so it needs your confirmation"
    incompatible: "%{kind} %{version} does not support the new Minecraft version; replace it with a compatible %{kind} version or remove the loader"
    incompatible_no_replacement: "%{kind} %{version} does not support the new Minecraft version, and no %{kind} version is available for it; remove the loader to continue"
    instance: "Failed to read or save the instance: %{error}"
    prepare: "Failed to prepare the game for the loader: %{error}"
  jvm:
    memory_flag: "Extra JVM arguments must not contain the memory argument \"%{flag}\"; use the memory settings to change the heap size"
    version_flag: "Extra JVM arguments must not contain a -version: argument; choose the Java version in the Java settings"
  download:
    failed: "Download failed %{url}: %{reason}"
    reason:
      http: "the server returned HTTP status %{status}"
      hash_mismatch: "file checksum mismatch (expected %{expected}, got %{actual})"
      size_mismatch: "file size mismatch (expected %{expected} bytes, got %{actual} bytes)"
      too_slow: "the download source is too slow"
      network: "network error: %{error}"
      io: "could not write the file: %{error}"
      no_attempt: "no download source was tried"
  runtime:
    unavailable: "Component %{component} is unavailable: this platform has no official Java runtime; please set the Java path manually in the settings"
    invalid_component: "Invalid runtime component name: %{component}"
  prepare:
    unknown_version: "Unknown game version: %{version}"
    java_too_old: "Java is too old: this version needs Java %{required}, but the selected Java is %{found}"
    java_not_found: "No usable Java found: %{path}"
    invalid_jvm_args: "Invalid extra JVM arguments: %{error}"
    runtime: "Failed to install the Java runtime: %{error}"
    download: "Failed to download game files: %{error}"
    io: "File operation failed: %{error}"
    json: "Failed to parse version data: %{error}"
    unsafe_metadata: "Version data contains an unsafe file name: %{name}"
    loader_needs_reinstall: "The %{kind} installation for this instance (version %{version}) is incomplete or was deleted. Reinstall the loader and try again."
