[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
# gpui-kit 0.8 is built on gpui-pre =0.3.9; name the same GPUI here so every
# crate that reaches for it directly gets the one gpui-kit uses.
gpui-kit = "0.8"
gpui = { package = "gpui-pre", version = "=0.3.9" }
tokio = "1.54.1"

# gpui, wgpu and friends are unusably slow unoptimised; keep our own crates
# quick to rebuild but optimise every dependency, even in `cargo run`.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
